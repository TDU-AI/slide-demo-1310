<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 09 — Cảm ơn</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="deck/deck.css" rel="stylesheet">
<link href="deck/theme.css" rel="stylesheet">
<link href="deck/tdu-v2.css" rel="stylesheet">
<style>
/* =========================================================
   SLIDE 9 — CẢM ƠN · KHÉP VÒNG với bìa: cùng hành lang của slide 1 nhưng lúc rạng sáng (ảnh s9 = s1 chỉnh thời điểm)
   → "một ngày mới" cho kỳ thi. Bố cục chữ trái như bìa; không nhịp bấm; cảm xúc: LẮNG.
   ========================================================= */
.scrim{background:
  linear-gradient(90deg,rgba(var(--bg-rgb),.5) 0%,rgba(var(--bg-rgb),.25) 42%,rgba(var(--bg-rgb),0) 56%),
  linear-gradient(180deg,rgba(var(--bg-rgb),.35) 0%,rgba(var(--bg-rgb),0) 20%,rgba(var(--bg-rgb),0) 74%,rgba(var(--bg-rgb),.55) 100%)}
.copy{top:300px;width:1000px}
h1{font-size:136px;line-height:1.08;letter-spacing:-.03em}
.sub{margin-top:40px;font-size:44px;line-height:1.35;font-weight:500;color:var(--ink)}
.chot{margin-top:48px;display:inline-flex}
.chot .tag{font-size:26px;padding:12px 26px 11px}
.trinh-bay{position:absolute;left:var(--margin);bottom:70px;z-index:2;display:flex;gap:22px}
.trinh-bay::before{content:"";flex:none;width:4px;border-radius:2px;background:var(--accent)}
.trinh-bay b{display:block;font-size:30px;font-weight:600;color:var(--ink-strong)}
.trinh-bay span{display:block;font-size:24px;color:var(--muted);margin-top:2px}
</style>
</head>
<body data-image="assets/s9.webp,assets/s9.png,assets/s1.webp">
<div class="stage" id="stage">
  <div class="bg">
    <div class="bg-move">
      <div class="bg-kb" style="--kb-origin:66% 54%">
        <img id="bgImg" alt="">
        <video id="bgVid" muted loop playsinline autoplay preload="auto"></video>
      </div>
    </div>
  </div>
  <div class="scrim"></div><div class="vignette"></div><div class="grain"></div>

  <header class="brand">
    <div class="org"><img src="assets/logo.png" alt="Logo Trường Đại học Thành Đông"><div class="org-text"><span>TRƯỜNG ĐẠI HỌC</span><strong>THÀNH ĐÔNG</strong></div></div>
    <span class="vach"></span><span class="ten-cong">Cổng thi trực tuyến</span>
  </header>

  <section class="copy">
    <h1><span class="mask"><span class="line" style="--d:.2s">Xin cảm ơn.</span></span></h1>
    <p class="sub anim" style="--d:.7s">Mời quý thầy cô đặt câu hỏi.</p>
    <div class="chot anim" style="--d:1.1s"><span class="tag">AI đề xuất — giáo viên quyết định</span></div>
  </section>

  <div class="trinh-bay anim" style="--d:1.4s" data-qa-meta>
    <div><b>Lê Anh Tuấn</b><span>Trung tâm Ứng dụng Trí tuệ nhân tạo (A.I)</span></div>
  </div>

  <div class="ph-badge">Chưa có ảnh nền · thả ảnh vào assets/s9.png</div>
  <div class="credit">Hình nền tạo bằng AI</div>
</div>
<script src="deck/deck.js"></script>
</body>
</html>
